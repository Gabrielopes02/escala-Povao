<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<div id="caixa" draggable="true">Arraste-me</div>
<div id="alvo" style="width: 200px; height: 200px; border: 2px dashed #ccc;">Solte aqui</div>

<script>
  const caixa = document.getElementById('caixa');
  const alvo = document.getElementById('alvo');

  caixa.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', e.target.id);
  });

  alvo.addEventListener('dragover', (e) => {
    e.preventDefault(); // Permite soltar o elemento
  });

  alvo.addEventListener('drop', (e) => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    const elemento = document.getElementById(id);
    alvo.appendChild(elemento);
  });
</script>
</html>
